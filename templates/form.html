<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg,#7ee8fa,#80ffdb);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0;
}

.card{
  background:#fff;
  width:900px;
  max-width:95%;
  display:flex;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
}

/* LEFT IMAGE */
.left{
  width:45%;
  background:url("https://images.unsplash.com/photo-1519681393784-d120267933ba") center/cover no-repeat;
}

/* RIGHT FORM */
.right{
  width:55%;
  padding:40px;
}

h2{
  margin-bottom:25px;
  font-weight:600;
}

.row{
  display:flex;
  gap:15px;
}

.field{
  flex:1;
}

label{
  font-size:13px;
  font-weight:600;
  display:block;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:11px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
  margin-bottom:15px;
}

button{
  width:100%;
  padding:14px;
  background:#1a3c7c;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}

button:hover{
  background:#102b5f;
}

/* MOBILE */
@media(max-width:768px){
  .card{flex-direction:column;}
  .left{height:200px;width:100%;}
  .right{width:100%;}
}
</style>
</head>

<body>

<div class="card">
  <div class="left"></div>

  <div class="right">
    <h2>Registration</h2>

    <form method="POST" action="/">

      <div class="row">
        <div class="field">
          <label>First Name</label>
          <input type="text" name="first_name" required>
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" name="last_name" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Date of Birth</label>
          <input type="text" name="dob" required>
        </div>
        <div class="field">
          <label>Mobile</label>
          <input type="tel" name="mobile" pattern="[0-9]{10}" required>
        </div>
      </div>

      <label>Address</label>
      <input type="text" name="address" required>

      <div class="row">
        <div class="field">
          <label>Father's Name</label>
          <input type="text" name="father_name" required>
        </div>
        <div class="field">
          <label>Mother's Name</label>
          <input type="text" name="mother_name" required>
        </div>
      </div>

      <label>Aadhaar Number</label>
      <input type="text" name="aadhaar" pattern="[0-9]{12}" required>

      <button type="submit">SUBMIT</button>
    </form>
  </div>
</div>

</body>
</html>
